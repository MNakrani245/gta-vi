<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">GTA VI Countdown emblem</title>
  <desc id="desc">A geometric VI monogram inside a neon countdown dial</desc>
  <defs>
    <linearGradient id="neon" x1="14" y1="12" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset=".38" stop-color="#ff7a68"/>
      <stop offset=".72" stop-color="#df5ca7"/>
      <stop offset="1" stop-color="#7957c8"/>
    </linearGradient>
    <linearGradient id="metal" x1="30" y1="27" x2="69" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf6"/>
      <stop offset=".48" stop-color="#f8c97d"/>
      <stop offset="1" stop-color="#ef658d"/>
    </linearGradient>
    <radialGradient id="face" cx="0" cy="0" r="1" gradientTransform="translate(36 28) rotate(55) scale(58)">
      <stop stop-color="#342345"/>
      <stop offset=".48" stop-color="#181020"/>
      <stop offset="1" stop-color="#09060e"/>
    </radialGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#050208" flood-opacity=".8"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="43" fill="#08050d" stroke="#fff8ed" stroke-width="1.4" opacity=".96" filter="url(#shadow)"/>
  <circle cx="48" cy="48" r="39.5" fill="url(#face)" stroke="url(#neon)" stroke-width="4"/>
  <circle cx="48" cy="48" r="34.5" fill="none" stroke="#fff8ed" stroke-opacity=".18" stroke-width="1"/>
  <path d="M48 8a40 40 0 0 1 34.4 19.6" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <g stroke="#fff8ed" stroke-linecap="round" opacity=".82">
    <path d="M48 8v6" stroke-width="2.2"/>
    <path d="M68 13.4l-3 5.2M82.6 28l-5.2 3M88 48h-6M82.6 68l-5.2-3M68 82.6l-3-5.2M48 88v-6M28 82.6l3-5.2M13.4 68l5.2-3M8 48h6M13.4 28l5.2 3M28 13.4l3 5.2" stroke-width="1.5"/>
  </g>
  <path d="M48 4l3.2 5.6h-6.4z" fill="#c9e75f" filter="url(#glow)"/>

  <text x="48" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="800" letter-spacing="2.4" fill="#fff8ed" opacity=".86">GTA</text>

  <g filter="url(#shadow)">
    <path d="M21.5 31h12.8l9.2 29.7L52.7 31h12.8L51.3 71H35.7z" fill="#09060e" stroke="#09060e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M21.5 31h12.8l9.2 29.7L52.7 31h12.8L51.3 71H35.7z" fill="url(#metal)" stroke="#fff8ed" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M66.5 31h10v40h-10z" fill="#09060e" stroke="#09060e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M66.5 31h10v40h-10z" fill="url(#neon)" stroke="#fff8ed" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <rect x="25" y="72" width="46" height="10" rx="5" fill="#09060e" stroke="#fff8ed" stroke-opacity=".42"/>
  <text x="48" y="79.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="5.8" font-weight="800" letter-spacing="1.15" fill="#fff8ed">COUNTDOWN</text>
  <circle cx="20" cy="48" r="2.2" fill="#ef6b5b" filter="url(#glow)"/>
</svg>
